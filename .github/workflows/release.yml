name: Python package build and publish with uv

on:
  release:
    types: [created]

  # Dry run of the whole release path. `publish` is gated on
  # `github.event_name == 'release'`, so a manual run builds every wheel, runs
  # the completeness gate and `twine check`, and never uploads anything.
  #
  # NOTE: workflow_dispatch only becomes available once this file is on the
  # default branch. To dry-run from a feature branch before merging, add that
  # branch to the `push` filter below, push, and remove it again afterwards.
  workflow_dispatch:

  push:
    branches:
      - 'ci/release-dryrun-**'

jobs:
  build:
    runs-on: ubuntu-latest
    # No matrix on purpose: the manylinux action below builds *every* interpreter
    # listed in `python-versions` inside its own container, so a matrix would just
    # rebuild the identical set of wheels N times. Add new versions to
    # `python-versions` instead.
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels (manylinux)
        uses: RalfG/python-wheels-manylinux-build@v0.7.1-manylinux2014_x86_64
        with:
          python-versions: 'cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314'
          build-requirements: 'uv setuptools>=74.0.0 Cython>=3.1.4 wheel>=0.44.0'
          system-packages: 'libmemcached-devel openssl-devel zlib-devel'
          # No pre-build-command on purpose. The wheels only need the build
          # requirements above (setuptools/Cython/wheel) to cythonize the .pyx
          # sources; the runtime dependencies are never imported at build time.
          # A `uv sync` here resolved the *whole* dependency tree against
          # whichever interpreter uv discovered inside the manylinux image --
          # which is now the free-threaded CPython 3.14t -- and orjson ships no
          # free-threaded wheels, so it fell back to its Rust sdist and failed
          # with "orjson does not support free-threaded Python".
          package-path: '.'

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*-manylinux*.whl
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build wheels (Windows)
        # Build isolation installs only the requirements in [build-system].
        run: uv build --wheel --python ${{ matrix.python-version }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist/*-win_amd64.whl
          if-no-files-found: error

  build-macos:
    # macos-15 is arm64 (Apple Silicon) and pinned on purpose:
    #   * macos-13 was retired on 2025-12-04 -- jobs pinned to it queue forever.
    #   * macos-latest now resolves to the macOS 26 image, which moves under us.
    # actions/setup-python hands this runner a *universal2* interpreter, so the
    # wheels come out tagged `macosx_11_0_universal2` with real arm64 AND
    # x86_64 slices -- verified against the Mach-O headers. Intel macOS is
    # therefore covered too, and no `macos-15-intel` job is needed. If a future
    # image ever yields a thin arm64 interpreter the tag becomes
    # `macosx_*_arm64`; both are accepted below, and the arch gate adapts.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Pin the deployment target so the platform tag is macosx_11_0_* instead
      # of inheriting whatever target the discovered interpreter was built with.
      # ARCHFLAGS is deliberately NOT set: forcing `-arch arm64` under a
      # universal2 interpreter would produce arm64-only binaries that sysconfig
      # still tags `universal2`, i.e. a wheel claiming Intel support it lacks.
      # The tag is asserted explicitly after the build instead.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # `actions/python-versions` publishes no darwin-arm64 build before
          # 3.10.11, so keep these as minor versions (resolved to the newest
          # patch). Pinning an exact old patch here will fail to install.
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build wheels (macOS)
        # Build isolation installs only the requirements in [build-system].
        run: uv build --wheel --python ${{ matrix.python-version }}

      - name: Verify the platform tag covers Apple Silicon
        # Guards against publishing a wheel whose filename does not actually
        # serve Apple Silicon (e.g. a plain `x86_64` tag from a mis-selected
        # interpreter). `universal2` is accepted: it contains an arm64 slice.
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::uv build produced no wheel"
            exit 1
          fi
          for whl in "${wheels[@]}"; do
            name=$(basename "$whl")
            case "$name" in
              *macosx*arm64.whl|*macosx*universal2.whl)
                echo "ok: $name" ;;
              *)
                echo "::error::$name is not an Apple Silicon wheel. Expected a macosx_*_arm64 or macosx_*_universal2 tag."
                exit 1 ;;
            esac
          done

      - name: Verify the binaries match the platform tag
        # The extensions link nothing outside libSystem/libpython, so there are
        # no dylibs to vendor -- delocate runs purely as an architecture gate.
        # The requirement is derived from the tag rather than hardcoded: a
        # `universal2` wheel carrying only arm64 slices promises Intel support
        # it does not have, and that is exactly what this must catch.
        run: |
          for whl in dist/*-macosx*.whl; do
            name=$(basename "$whl")
            case "$name" in
              *universal2.whl) required="x86_64,arm64" ;;
              *arm64.whl)      required="arm64" ;;
              *) echo "::error::unexpected platform tag in $name"; exit 1 ;;
            esac
            echo "::group::$name (require-archs=$required)"
            uv tool run --from delocate delocate-listdeps --all "$whl"
            uv tool run --from delocate delocate-wheel --require-archs "$required" \
              -w "$RUNNER_TEMP/archcheck" "$whl"
            echo "::endgroup::"
          done

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python-version }}
          path: dist/*-macosx*.whl
          if-no-files-found: error

  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build source distribution
        run: |
          # Pin the interpreter explicitly: left to its own discovery uv can pick
          # a free-threaded build (3.13t/3.14t), and some dependencies (orjson)
          # publish no free-threaded wheels and refuse to compile there.
          uv sync --extra build --no-dev --python 3.11

          # Build source distribution
          uv build --sdist --python 3.11

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Everything that can be checked WITHOUT credentials lives here, so a manual
  # (workflow_dispatch) run exercises the full aggregation and gating logic --
  # which is exactly where a silent failure can hide -- without touching PyPI.
  validate-dist:
    name: Validate the distribution set
    needs: [build, build-windows, build-macos, build-source]
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Organize distribution files
        run: |
          mkdir -p dist

          # Move all wheel files to dist directory
          find dist-artifacts -name '*.whl' -exec mv {} dist/ \;

          # Move source distribution to dist directory
          find dist-artifacts -name '*.tar.gz' -exec mv {} dist/ \;

      - name: Check for distribution files
        id: check_dist
        run: |
          echo "Checking for distribution files..."

          # Check for manylinux wheels
          if ls dist/*-manylinux*.whl 1> /dev/null 2>&1; then
            echo "Found manylinux wheels:"
            ls -la dist/*-manylinux*.whl
            echo "HAS_MANYLINUX_WHEELS=true" >> $GITHUB_ENV
          else
            echo "No manylinux wheels found."
            echo "HAS_MANYLINUX_WHEELS=false" >> $GITHUB_ENV
          fi

          # Check for Windows wheels
          if ls dist/*-win_amd64.whl 1> /dev/null 2>&1; then
            echo "Found Windows wheels:"
            ls -la dist/*-win_amd64.whl
            echo "HAS_WINDOWS_WHEELS=true" >> $GITHUB_ENV
          else
            echo "No Windows wheels found."
            echo "HAS_WINDOWS_WHEELS=false" >> $GITHUB_ENV
          fi

          # Check for macOS wheels. build-macos already asserted every one of
          # them carries an Apple Silicon tag, so any macosx wheel here is one.
          if ls dist/*-macosx*.whl 1> /dev/null 2>&1; then
            echo "Found macOS wheels:"
            ls -la dist/*-macosx*.whl
            echo "HAS_MACOS_WHEELS=true" >> $GITHUB_ENV
          else
            echo "No macOS wheels found."
            echo "HAS_MACOS_WHEELS=false" >> $GITHUB_ENV
          fi

          # Check for source distribution
          if ls dist/*.tar.gz 1> /dev/null 2>&1; then
            echo "Found source distribution:"
            ls -la dist/*.tar.gz
            echo "HAS_SOURCE_DIST=true" >> $GITHUB_ENV
          else
            echo "No source distribution found."
            echo "HAS_SOURCE_DIST=false" >> $GITHUB_ENV
          fi

      - name: List all distribution files
        run: |
          echo "All files in dist directory:"
          ls -la dist/
          echo ""
          echo "File count: $(ls -1 dist/ | wc -l)"

      # Refuse to publish a partial release: a version that lands on PyPI with
      # wheels but no sdist (or vice versa) cannot be corrected, only yanked.
      # Every new platform gets a check here -- NOT a glob in the upload step.
      - name: Verify the release is complete
        run: |
          if [ "$HAS_MANYLINUX_WHEELS" != "true" ] \
            || [ "$HAS_WINDOWS_WHEELS" != "true" ] \
            || [ "$HAS_MACOS_WHEELS" != "true" ] \
            || [ "$HAS_SOURCE_DIST" != "true" ]; then
            echo "::error::Incomplete release - Linux wheels: $HAS_MANYLINUX_WHEELS, Windows wheels: $HAS_WINDOWS_WHEELS, macOS wheels: $HAS_MACOS_WHEELS, sdist: $HAS_SOURCE_DIST"
            exit 1
          fi

      - name: Validate package metadata
        run: |
          uv tool install twine
          uv tool run twine check dist/*

  publish:
    needs: validate-dist
    runs-on: ubuntu-latest
    # The only step of the release path that a dry run must never reach.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/navconfig
    permissions:
      id-token: write  # For trusted publishing to PyPI
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Organize distribution files
        run: |
          mkdir -p dist
          find dist-artifacts -name '*.whl' -exec mv {} dist/ \;
          find dist-artifacts -name '*.tar.gz' -exec mv {} dist/ \;
          ls -la dist/

      # Wheels and sdist go up in a single twine invocation so the release is
      # published as one unit. --skip-existing keeps a re-run idempotent instead
      # of failing on files that already uploaded before an earlier attempt died.
      #
      # `dist/*` on purpose, NOT a list of per-platform globs: a glob list
      # silently drops any wheel whose platform tag nobody remembered to add
      # (that is how macOS wheels would have gone missing). validate-dist is
      # the gate that makes uploading everything in dist/ safe.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.NAVCONFIG_PYPI_API_TOKEN }}
        run: |
          uv tool install twine
          uv tool run twine upload --non-interactive --skip-existing dist/*

  test-install:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for PyPI propagation
        run: python -c "import time; time.sleep(60)"

      - name: Test installation from PyPI
        shell: bash
        run: |
          # --only-binary: a wheel must exist for this OS/interpreter. Falling
          # back to the sdist here would hide exactly the failure we test for.
          uv pip install --system --python ${{ matrix.python-version }} --only-binary navconfig navconfig

          # navconfig cannot be imported without a project: `navconfig/logging/
          # __init__.py` does `from navconfig import config, BASE_DIR`, which
          # trips the lazy bootstrap -> project_root(). Detection is anchored on
          # the installed package's location, not the working directory, so the
          # scaffold needs SITE_ROOT pointing at it. This job has no checkout,
          # so there was nothing to detect and the import check could only ever
          # fail -- which it silently did, until `continue-on-error: true` came
          # off this step.
          mkdir -p navconfig-smoke
          cd navconfig-smoke
          python -m navconfig.cli env create
          export SITE_ROOT="$PWD"

          python -c "import navconfig; print(f'NavConfig {navconfig.__version__} installed successfully')"
          python -c "import navconfig.exceptions, navconfig.utils.functions, navconfig.utils.types, navconfig.utils.json, navconfig.loaders.parsers.toml, navconfig.loaders.parsers.yaml, navconfig.logging.logger; print('all 7 extensions import')"
          python -c "from navconfig import config; print('Config object created successfully')"
