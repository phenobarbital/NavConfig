name: Build and test

# Compile the Cython extensions on every platform we ship wheels for, on every
# change. Before this workflow existed the first macOS/Windows compile of a
# change happened inside `release.yml` -- i.e. after the GitHub release had
# already been created, when the only remedy is yanking a version.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Same three platforms release.yml publishes for. macos-15 is arm64.
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel --python ${{ matrix.python-version }}

      - name: Show the resulting platform tag
        shell: bash
        run: ls -l dist/

      - name: Install the wheel and import it
        shell: bash
        # Run from RUNNER_TEMP, not the checkout: the repository root contains a
        # `navconfig/` directory, so `import navconfig` there would pick up the
        # source tree (which has no compiled extensions) instead of the wheel
        # we just installed, and the check would prove nothing.
        #
        # This asserts wheel integrity -- that the compiled extensions load on
        # this platform -- and nothing else. It deliberately does NOT touch
        # `navconfig.config`: that attribute triggers the lazy bootstrap, which
        # calls project_root() and needs a project to detect (an env/<env>/.env
        # scaffold, or SITE_ROOT). There is no project in RUNNER_TEMP, by
        # design, so requiring one here would test the harness, not the wheel.
        # `__version__` is imported eagerly, so reading it is bootstrap-free.
        run: |
          uv pip install --system --python ${{ matrix.python-version }} dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import navconfig; print('navconfig', navconfig.__version__)"
          python -c "import navconfig.exceptions, navconfig.utils.functions, navconfig.utils.types, navconfig.utils.json, navconfig.loaders.parsers.toml, navconfig.loaders.parsers.yaml, navconfig.logging.logger; print('all 7 extensions import')"

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        # The edges of the supported range; the wheel job above covers every
        # interpreter in between for compilation.
        python-version: ["3.10", "3.14"]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync the environment
        # --python is explicit on purpose: left to discover an interpreter, uv
        # can select a free-threaded build (3.13t/3.14t), and orjson publishes
        # no free-threaded wheels and refuses to compile there.
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run the test suite
        # tests/test_config.py and tests/test_kardex_vault.py cannot even be
        # COLLECTED on a clean checkout -- they fail with "NavConfig
        # initialization failed: environment assets are missing" because they
        # need an `env/<environment>/.env` scaffold, and `env/` is gitignored
        # and absent from the repository. They pass locally only for developers
        # who have run `kardex env create`. Teaching CI to scaffold that (and
        # deciding what those tests should assert against a default env) is
        # follow-up work; the remaining ~102 tests run here, which is coverage
        # this repository has never had on any platform.
        run: >-
          uv run --no-sync pytest -q
          --ignore=tests/test_config.py
          --ignore=tests/test_kardex_vault.py
